[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-etl"
version = "1.0.0"
description = "Python sales ETL pipeline using Bronze, Silver, and Gold layers."
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3.0", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
sales-etl = "main:main"

[tool.setuptools]
py-modules = ["bronze", "silver", "gold", "logger", "main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]